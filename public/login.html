<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0f0a" />
    <meta name="color-scheme" content="dark light" />
    <meta name="application-name" content="Overseer" />
    <meta name="apple-mobile-web-app-title" content="Overseer" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Sign in - Overseer</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script src="/js/theme-init.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/js/login.js"></script>
  </head>
  <body class="login-page">
    <main class="login-wrap">
      <a class="brand" href="/" aria-label="Overseer"
        ><img class="brand-mark" src="/favicon.svg" alt="" width="38" height="38" /><span>Overseer</span></a
      >
      <section class="card auth-card" id="auth-card">
        <h1 id="auth-title">Loading</h1>
        <p class="muted" id="auth-help"></p>
        <form id="auth-form"></form>
        <p class="error-message" id="auth-error" role="alert" aria-live="polite"></p>
        <button class="button secondary full" id="passkey-button" type="button" hidden>Sign in with a passkey</button>
      </section>
    </main>
  </body>
</html>
